



<!DOCTYPE html>
<html>
<head>
  <title>Text Changer</title>
<link href="https://fonts.googleapis.com/css2?family=Cantata+One&display=swap" rel="stylesheet">
  <style>
    body {
       font-family: "Cantata One", serif;
       font-weight: 400;
       font-style: normal;
    }

    .text {
      color: black;
      font-size: 36px;
      cursor: pointer;
      transition: font-size 0.3s;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: -1px -1px 0 orange, 1px -1px 0 orange, -1px 1px 0 orange, 1px 1px 0 orange;
animation: outlineAnimation 10s infinite alternate;
}

@keyframes outlineAnimation {
  0% {
    text-shadow: -1px -1px 0 white, 1px -1px 0 white, -1px 1px 0 white, 1px 1px 0 white;
  }
  25% {
    text-shadow: -1px -1px 0 red, 1px -1px 0 red, -1px 1px 0  red, 1px 1px 0 red;
  }
  75% {
    text-shadow: -1px -1px 0 orange, 1px -1px 0 orange, -1px 1px 0 orange, 1px 1px 0 orange;
  }75% {
    text-shadow: -1px -1px 0 yellow, 1px -1px 0 yellow, -1px 1px 0 yellow, 1px 1px 0 yellow;
  } 100% {
    text-shadow: -1px -1px 0 green, 1px -1px 0 green, -1px 1px 0 green, 1px 1px 0 green;
  }  100% {
    text-shadow: -1px -1px 0 white, 1px -1px 0 white, -1px 1px 0 white, 1px 1px 0 white;
  }  100% {
    text-shadow: -1px -1px 0 white, 1px -1px 0 white, -1px 1px 0 white, 1px 1px 0 white;
  }
    }

    .text:hover {
      font-size: 48px;
    }
  </style>
</head>
<body>
  <div class="text" onclick="changeText()">textchanger</div>

  <script>
    var texts = [ 
    "Hi",
    "This Works!",
];

    var currentIndex = 0;

    window.onload = function() {
      currentIndex = Math.floor(Math.random() * texts.length);
      document.querySelector(".text").textContent = texts[currentIndex];
    };

    function changeText() {
      currentIndex = (currentIndex + 1) % texts.length;
      document.querySelector(".text").textContent = texts[currentIndex];
    }
  </script>
</body>
</html>
